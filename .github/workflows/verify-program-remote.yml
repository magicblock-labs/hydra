name: Verify Program (Remote)

# Asks OtterSec to rebuild a Hydra program from its otter-verify PDA, so explorers
# show it as verified. Run it after each mainnet upgrade proposal executes in Squads.

on:
  workflow_dispatch:
    inputs:
      program:
        description: Program to verify
        type: choice
        options: [hydra, hydra-ephemeral]
        default: hydra

permissions:
  contents: read

env:
  # Keep in sync with propose-program-upgrade.yml.
  PROGRAM_IDS: |
    {
      "hydra":           "Hydra17i1feui9deaxu6d1TzSQMRNHeBRkDR1Awy7zea",
      "hydra-ephemeral": "eHyd5BU8QffvHi4GnXwxrK4WpS7pM2x9UGKHBWii7mf"
    }

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Reads public mainnet accounts only, so the action's default public RPC
      # is enough and no secret is needed.
      - uses: magicblock-labs/.github/actions/verify-program-remote@ef27487ce794e628f597c00795f573b793dd498d
        with:
          program-id: ${{ fromJSON(env.PROGRAM_IDS)[inputs.program] }}
