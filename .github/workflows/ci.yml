name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SOLANA_VERSION: v4.0.1
  ANCHOR_VERSION: 1.0.2

jobs:
  # ---------------------------------------------------------------------------
  # Formatting — the root workspace plus the excluded anchor / e2e crates.
  # ---------------------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust (rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt

      - name: Check formatting
        run: make fmt-check

  # ---------------------------------------------------------------------------
  # Default feature set: lint + the full test suite (workspace, examples, anchor)
  # ---------------------------------------------------------------------------
  default:
    name: lint + test (default, incl. live e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt

      - name: Install Solana toolchain (build-sbf)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/solana-install" "https://release.anza.xyz/${SOLANA_VERSION}/install"
          sh "$RUNNER_TEMP/solana-install"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Keep the version in sync with `[toolchain] anchor_version` in
      # examples/anchor/Anchor.toml — on a mismatch the CLI reaches for avm.
      - name: Install Anchor CLI (build + test the anchor example)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `make ci` runs the live e2e suite, which needs both validator binaries.
      # The version is pinned in the Makefile so a local run matches CI.
      - name: Install MagicBlock validators (mb-test-validator + ephemeral-validator)
        run: |
          make install-validators
          mb-test-validator --version
          ephemeral-validator --version

      # `tests/e2e` is its own workspace, so it needs its own cache entry.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests/e2e

      # The validators are file-descriptor and inotify hungry; `prlimit --pid $$`
      # only affects this step's shell, so it must share it with `make ci`.
      - name: Default CI checks
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576
          sudo sysctl fs.inotify.max_user_instances=1280
          sudo sysctl fs.inotify.max_user_watches=655360
          make ci
